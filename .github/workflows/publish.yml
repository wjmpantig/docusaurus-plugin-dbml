name: Publish to npm

# Kept at this filename because npm trusted publishing binds to the workflow
# that publishes — renaming this file, or moving the release into another
# workflow, breaks the OIDC claim until the npm setting is updated to match.
#
# The tag trigger is gone: semantic-release creates the tag itself, so a tag
# trigger would start a second run of this workflow.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Releasing needs the library's own deps only; example/ is a workspace
      # and would otherwise pull all of Docusaurus into this job.
      - run: npm ci --workspaces=false --include-workspace-root

      - run: npm run build

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
